pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // record_android 1.3.0 以 AGP 8.5.2 / Kotlin 1.8.21 / Java 17 编译。
    // Flutter 3.24 模板默认的 AGP 7.3.0 + Kotlin 1.7.10 会报：
    //   - "Module was compiled with an incompatible version of Kotlin"（旧 KGP 读不懂 1.9 元数据）
    //   - "D8: Sealed classes are not supported as program classes"（旧 R8 不认 Java 17）
    // 只升到 AGP 7.4.2 仍不够：其 R8 仍无法 dex kotlin-stdlib 1.9.24 / annotation-jvm 1.9.1
    // （D8: com.android.tools.r8.kotlin.H）。故使用 AGP 8.1.0（自带 R8 8.1）+ Gradle 8.4。
    // 三者与 Flutter 3.24 / JDK 17 兼容；升级 Flutter 前不要回退。
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"

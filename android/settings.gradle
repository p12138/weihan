pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 对齐 Flutter 3.50.0 模板基线（本地 SDK 现场 flutter create 取到的权威值）：
    // AGP 9.3.1 / KGP 2.4.20 / Gradle 9.5.0。
    // 3.24 时代的 AGP 8.1.0 会被 Flutter 3.50 注入的 KGP 2.4.20 判为
    // "AGP 8.1.0 低于最低支持 8.5.2"，且 Flutter 自身的版本校验还要求
    // AGP >= 9.1.1、Gradle >= 9.3.1，所以整条原生链必须一起升，不能只改一处。
    // KGP 只声明版本不 apply：AGP 9 起禁止显式应用 kotlin-android，
    // Flutter 插件在 android.builtInKotlin=false 时会自动补齐。
    id "com.android.application" version "9.3.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
}

include ":app"

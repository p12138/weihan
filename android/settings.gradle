pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // record_android 1.3.0 以 Java 17 / Kotlin 1.8+ 编译，Flutter 3.24 模板默认的
    // AGP 7.3.0 (自带旧 D8，拒绝 Java 17 sealed classes) 和 Kotlin 1.7.10
    // (读不懂 kotlin-stdlib 1.9.x 元数据) 会同时导致 :app:compileDebugKotlin 与
    // :app:mergeLibDexDebug 失败。保持 Gradle 7.6.3 不变，只把这两个插件抬到
    // 与插件要求匹配的最小版本；升级 Flutter 前不要回退。
    id "com.android.application" version "7.4.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"

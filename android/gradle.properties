org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.50 模板基线：AGP 9 默认启用内置 Kotlin / 新 DSL，但现有 Groovy 壳
# 与 Flutter 插件仍走旧路径，显式关掉两项。不写的话 CI 里 migrator 也会现场补，
# 提交进来可让构建可复现、且日志里不再出现 "Upgrading gradle.properties"。
android.newDsl=false
android.builtInKotlin=false

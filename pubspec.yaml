name: uyghur_interpreter
description: >-
  融合 App（维汉双向语音翻译）· 个人自用双端工程。小牛翻译负责文字互译，
  讯飞 WebAPI 负责中维双向语音识别与朗读，密钥只在运行时填写。
publish_to: 'none'
version: 0.4.0+1

environment:
  # Flutter 3.24.0 自带 Dart 3.5.x；下限对齐 CI 固定版本
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 小牛翻译 v2 的 authStr 需要对参数串做 MD5；纯 Dart 实现，无平台通道。
  crypto: ^3.0.3
  # 按住说话：16k / 16bit / 单声道 PCM 流，正好是讯飞 ASR 要求的格式。
  # 锁 5.2.0：与 Flutter 3.24 / Dart 3.5 同期，Android minSdk 23、iOS 11+。
  record: 5.2.0
  # 朗读译文：播放讯飞 TTS 返回的 mp3。
  audioplayers: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# CI 固定 Flutter 3.24.0 / Dart 3.5.x。record 5.2.0 与 audioplayers 6.1.0
# 对各平台实现用的是 ^ 浮动约束，不做锁定会解析到 2026 年的新实现，实测后果：
#   - record_android 1.5.x 的 build.gradle 引用 flutter 扩展 →
#     旧版 Gradle 模板报 "compileSdkVersion is not specified"，Android 构建失败
#   - record_platform_interface 1.4+/1.6 新增 RecordMethodChannelPlatformInterface
#     抽象方法 → record_linux 0.x（被 <1.0.0 卡住）kernel 编译失败，iOS 构建失败
#   - audioplayers_android 5.2+ 要求 compileSdk 35
# 下面把整套插件族锁回 2024-11（record 5.2.0 发布时）的同期版本：接口与实现
# 逐一对齐，且都兼容 Dart 3.5。升级 Flutter 前不要移除。
dependency_overrides:
  record_platform_interface: 1.2.0
  record_android: 1.3.0
  record_darwin: 1.2.2
  record_web: 1.1.4
  record_windows: 1.0.4
  record_linux: 0.7.2
  audioplayers_platform_interface: 7.0.0
  audioplayers_android: 5.0.0
  audioplayers_darwin: 6.0.0
  audioplayers_web: 5.0.1
  audioplayers_windows: 4.0.0
  audioplayers_linux: 4.0.0

flutter:
  uses-material-design: true

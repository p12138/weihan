name: selfuse-android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug 无需任何密钥；release 需要 keystore Secrets"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - "v*"

concurrency:
  group: selfuse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Verify project structure
        run: python3 scripts/verify_project.py --scope all

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Generate android/ and ios/ native shells
        run: bash scripts/bootstrap.sh

      - name: Decide whether release signing is possible
        id: sign
        run: |
          want="${{ github.event.inputs.build_type || 'release' }}"
          if [ "${{ env.HAS_KEYSTORE }}" = "true" ] && [ "$want" = "release" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未提供 keystore 或选择了 debug：产出调试签名 APK，仅供自测，不伪装成 release"
          fi

      - name: Prepare release keystore
        if: steps.sign.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/selfuse.jks
          {
            echo "storeFile=selfuse.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build signed release APK
        if: steps.sign.outputs.enabled == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build debug APK (fallback, no secrets)
        if: steps.sign.outputs.enabled != 'true'
        run: flutter build apk --debug

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -type f -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selfuse-android-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

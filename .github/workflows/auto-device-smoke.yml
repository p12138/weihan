name: auto-device-smoke

# 用 GitHub 托管 runner 自带的 Android SDK / Xcode Simulator 代替人工装包测试。
#
# 分工：
#   verify-first-build.yml → 静态自检 / analyze / 单元与 widget 测试 / debug APK
#   本工作流               → 双端模拟器安装、启动、崩溃检查、截图（真机级可用性）
#
# 你的机器上不需要 Flutter、Android SDK、adb、Xcode，也不需要插线装包；
# push 之后这里自动跑完，看绿灯 + 下载截图即可。
# macOS runner 按 10 倍计费，故只在代码/配置变更时触发，纯文档改动不跑。

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "ios/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android 模拟器自动装包冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: Build debug APK for x86_64 emulator
        run: flutter build apk --debug --target-platform android-x64

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/device_smoke_android.sh

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ github.run_number }}
          path: dist/smoke-android.png
          if-no-files-found: warn
          retention-days: 14

  ios-simulator:
    name: iOS 模拟器自动装包冒烟
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          test -f Podfile || { echo "::error::ios/Podfile 缺失"; exit 1; }
          set -o pipefail
          if ! pod install --no-repo-update 2>&1 | tee /tmp/pod_install.log; then
            echo "::error::pod install 失败，日志末尾："
            tail -n 25 /tmp/pod_install.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build for iOS Simulator (no signing, no Apple account)
        run: flutter build ios --simulator --debug --no-codesign

      - name: Install, launch and check for crashes
        run: bash scripts/device_smoke_ios.sh

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-${{ github.run_number }}
          path: dist/smoke-ios.png
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### 双端模拟器冒烟" >> "$GITHUB_STEP_SUMMARY"
          echo "Android emulator 与 iOS Simulator 的装包/启动/崩溃检查由 CI 完成，无需人工装包。" >> "$GITHUB_STEP_SUMMARY"
          echo "截图见本 run 的 Artifacts。" >> "$GITHUB_STEP_SUMMARY"

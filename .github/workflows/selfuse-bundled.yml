name: selfuse-bundled-build

# 「自带凭证的自用包」：CI 在编译期把 Secrets 注入安装包，装到手机后开箱即用，
# 设置页不用再填 APPID / APIKey / APISecret / vcn，语音按钮直接可用。
#
# 安全边界（务必先读 README「自带凭证自用包」一节）：
#   * 凭证不写源码、不写 Git 历史、不出现在命令行参数与构建日志；
#   * 但凭证会打进安装包二进制，反编译可提取，等同把密钥交给拿到包的人；
#   * private 仓库：Artifact + 公开 Release 都传，最方便；
#   * public 仓库：Artifact 与公开 Release 都能被匿名下载，所以只发「草稿 Release」
#     —— 只有拥有写权限的你登录后可见可下载，并把历史上已公开的包自动撤回为草稿。
#     若明确接受密钥外泄风险，把仓库 Variable BUNDLE_ALLOW_PUBLIC 设为 1 可强制公开上传。
#
# 与 verify-first-build.yml 的分工：
#   * verify-first-build：无凭证的干净门禁包，push 必跑，可安全分发；
#   * 本工作流：仅自用、含凭证的包，产物 retention 仅 3 天。

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "ios/**"
      - "scripts/**"
      - ".github/workflows/selfuse-bundled.yml"
  workflow_dispatch:
    inputs:
      with_ios:
        description: "同时出 iOS 模拟器自带凭证包（消耗 macOS 计费分钟）"
        type: boolean
        default: false

concurrency:
  group: selfuse-bundled-${{ github.ref }}
  cancel-in-progress: true

# 发布到 Releases 需要写权限；其余只读足够。
permissions:
  contents: write

jobs:
  guard:
    name: 凭证与可见性检查
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.decide.outputs.artifact }}
      draft: ${{ steps.decide.outputs.draft }}
    env:
      # 仅做存在性判断，不打印任何值。
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
    steps:
      - name: 必需 Secret 齐全
        run: |
          missing=0
          for name in NIUTRANS_APP_ID NIUTRANS_API_KEY XFYUN_APP_ID XFYUN_API_KEY XFYUN_API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Secret ${name}，请到 Settings → Secrets and variables → Actions 补齐"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::凭证不齐，拒绝产出「看似免配置实则不可用」的安装包"
            exit 1
          fi
          echo "::notice::5 个必需 Secret 均已配置（未输出任何值）"

      - name: 决定发布方式（公开仓库只出草稿包）
        id: decide
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ALLOW_PUBLIC: ${{ vars.BUNDLE_ALLOW_PUBLIC }}
        run: |
          if [ "$REPO_PRIVATE" = "true" ] || [ "$ALLOW_PUBLIC" = "1" ]; then
            echo "artifact=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "::notice::允许公开上传自带凭证产物（private 仓库，或已显式放开 BUNDLE_ALLOW_PUBLIC）"
          else
            # public 仓库：Artifact 与公开 Release 都能被匿名下载，含凭证的包不能放上去。
            # 改成「草稿 Release」——只有拥有写权限的你登录后能看到与下载，匿名访客 404。
            echo "artifact=false" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库为 public：不上传 Artifact（可被第三方代理匿名下载），含凭证 APK 以草稿 Release 发布，只有你登录 GitHub 后能下载。"
          fi

      - name: public 仓库时把历史公开包撤回为草稿
        if: ${{ steps.decide.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 仓库从 private 转 public 时，之前发布的自带凭证包会突然变成人人可下载。
          # 这里把已公开的 Release 全部改回草稿，让下载重新需要登录账号。
          gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' > /tmp/published_tags.txt || true
          if [ ! -s /tmp/published_tags.txt ]; then
            echo "::notice::没有已公开的 Release 需要撤回"
            exit 0
          fi
          while read -r tag; do
            [ -z "$tag" ] && continue
            if gh release edit "$tag" --draft >/dev/null 2>&1; then
              echo "::notice::已把 ${tag} 撤回为草稿（公开仓库不再匿名可下载）"
            else
              echo "::warning::撤回 ${tag} 失败，请到 Releases 页手动改为 Draft"
            fi
          done < /tmp/published_tags.txt

  bundled-apk:
    name: Android 自带凭证 APK
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      NIUTRANS_UG_CODE: ${{ vars.NIUTRANS_UG_CODE }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      XFYUN_UG_VCN: ${{ secrets.XFYUN_UG_VCN }}
      XFYUN_ZH_VCN: ${{ vars.XFYUN_ZH_VCN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: 生成编译期配置（只输出键名）
        run: python3 scripts/write_bundle_defines.py /tmp/weihan_bundle_defines.json

      # 先证明 Dart 侧真的读到了注入值，并回归「设置页不回显 / 保存不清空」，
      # 再花几分钟做原生构建；避免构建完才发现注入链路有问题。
      - name: 注入自检 + 设置页回归
        run: |
          set -o pipefail
          if flutter test --timeout 90s --reporter expanded \
              --dart-define-from-file=/tmp/weihan_bundle_defines.json \
              test/bundled_config_test.dart 2>&1 | tee /tmp/bundled_config_test.log; then
            echo "::notice::内置凭证注入自检通过：配置已就绪、设置页不回显密钥、直接保存不清空"
          else
            echo "::error::内置凭证注入自检失败，输出如下："
            tail -n 60 /tmp/bundled_config_test.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Build 自带凭证 debug APK
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::flutter build apk (attempt ${attempt}/3)"
            if flutter build apk --debug \
                --dart-define-from-file=/tmp/weihan_bundle_defines.json \
                2>&1 | tee /tmp/bundled_apk.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            python3 scripts/emit_build_error.py \
              /tmp/bundled_apk.log "自带凭证 APK 构建" "${attempt}"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::构建失败，10s 后重试（第 ${attempt}/3 次）"
              sleep 10
            fi
          done
          echo "::error::自带凭证 APK 连续 3 次构建失败"
          exit 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-apk-build-log-${{ github.run_number }}
          path: /tmp/bundled_apk.log
          if-no-files-found: warn
          retention-days: 7

      # 只在 APK 里找「键名 / 提示文案」，不找也绝不打印凭证值。
      # 找不到只给 warning，不把门禁判红（Flutter 版本不同，snapshot 落点会变）。
      - name: 确认编译期配置确实进入安装包
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          apks = sorted(glob.glob('build/app/outputs/flutter-apk/*.apk'))
          if not apks:
              print('::error::没有找到构建产物 APK')
              raise SystemExit(1)
          path = apks[0]
          marker = b'BUNDLED_SELFUSE'
          hit = []
          with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                  if not name.endswith(('.so', '.bin', '.dat', '.json')):
                      continue
                  try:
                      data = zf.read(name)
                  except (RuntimeError, OSError):
                      continue
                  if marker in data:
                      hit.append(name)
          print('APK 内命中编译期标记的文件：%s' % (', '.join(hit) or '无'))
          if hit:
              print('::notice::已确认编译期配置打进 %s（只查键名，未读取任何凭证值）' % path.split('/')[-1])
          else:
              print('::warning::APK 内未搜索到 BUNDLED_SELFUSE 字面量；Dart 侧注入自检已通过，通常只是 snapshot 编码差异')
          PY

      - name: Upload 自带凭证 APK
        if: ${{ needs.guard.outputs.artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weihan-selfuse-bundled-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3

      # Actions 的 Artifacts 一定是 zip（平台强制），想直接下 .apk 只能走 Releases。
      # 每次构建发两个 Release：
      #   * 滚动 tag selfuse-latest —— 永远指向最新包，直链固定不变：
      #     https://github.com/<owner>/<repo>/releases/download/selfuse-latest/weihan-selfuse-debug.apk
      #   * 版本 tag v<版本>-build<run>  —— 留历史，方便回退到某一版
      - name: 发布到 Releases（免解压直链 + 历史版本）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLING_TAG: selfuse-latest
          DRAFT: ${{ needs.guard.outputs.draft }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,sys; m=re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml',encoding='utf-8').read(), re.M); print(m.group(1) if m else '0.0.0')")"
          tag="v${version}-build${GITHUB_RUN_NUMBER}"
          commit="${GITHUB_SHA:0:7}"
          apk="$(ls build/app/outputs/flutter-apk/*.apk | head -n1)"
          cp "$apk" weihan-selfuse-debug.apk
          sha="$(sha256sum weihan-selfuse-debug.apk | cut -d' ' -f1)"
          size="$(du -h weihan-selfuse-debug.apk | cut -f1)"

          # 草稿模式：只有仓库写权限者登录后可见可下载；解除时显式取消草稿状态，
          # 避免仓库转回 private 后包还留在草稿里找不到。
          if [ "${DRAFT}" = "true" ]; then
            edit_draft="--draft"
            create_draft="--draft"
            visibility_note="（草稿包：仓库为 public，请登录你的 GitHub 账号后下载）"
          else
            edit_draft="--draft=false"
            create_draft=""
            visibility_note=""
          fi

          note="自带凭证的自用语音翻译包，装到手机即可使用，设置页无需填写任何内容。
          版本 ${version} · 构建 #${GITHUB_RUN_NUMBER} · commit ${commit}
          APK SHA-256：${sha}
          体积：${size}${visibility_note}
          ⚠️ 凭证可被打包体反编译提取，请勿分发本包。"

          # 草稿 Release 在 releases/tags 接口上查不到，必须用 list 判断是否已存在。
          has_release() {
            gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -qx "$1"
          }

          # 滚动 tag：覆盖同一个文件，直链永远是最新版
          if has_release "$ROLLING_TAG"; then
            gh release edit "$ROLLING_TAG" --title "自用语音翻译包（最新）" --notes "$note" "$edit_draft"
          else
            gh release create "$ROLLING_TAG" --title "自用语音翻译包（最新）" --notes "$note" $create_draft
          fi
          gh release upload "$ROLLING_TAG" weihan-selfuse-debug.apk --clobber

          # 版本 tag：留历史，出问题可回到某一版
          if has_release "$tag"; then
            echo "::notice::${tag} 已存在，跳过历史版本创建"
          else
            gh release create "$tag" --title "融合 ${version}（构建 ${GITHUB_RUN_NUMBER}）" \
              --notes "$note" weihan-selfuse-debug.apk $create_draft
          fi

          if [ "${DRAFT}" = "true" ]; then
            echo "::notice::APK 已发为草稿 Release（${ROLLING_TAG} / ${tag}）。登录 GitHub 后在 Releases 页可见，直链 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/weihan-selfuse-debug.apk （sha256 ${sha}）"
          else
            echo "::notice::已发布：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/weihan-selfuse-debug.apk （sha256 ${sha}）"
          fi

      - name: 公开仓库说明（只出草稿包）
        if: ${{ needs.guard.outputs.artifact != 'true' }}
        run: |
          echo "::notice::仓库为 public：Artifact 不上传（公开仓库的 artifact 可被匿名代理下载），含凭证 APK 已以上面的草稿 Release 发布，登录 GitHub 账号后可下载。"

      - name: 清理 runner 临时凭证文件
        if: always()
        run: rm -f /tmp/weihan_bundle_defines.json

  bundled-ios:
    name: iOS 模拟器自带凭证包（手动可选）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_ios }}
    needs: guard
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      NIUTRANS_UG_CODE: ${{ vars.NIUTRANS_UG_CODE }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      XFYUN_UG_VCN: ${{ secrets.XFYUN_UG_VCN }}
      XFYUN_ZH_VCN: ${{ vars.XFYUN_ZH_VCN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          test -f Podfile || { echo "::error::ios/Podfile 缺失"; exit 1; }
          pod install --no-repo-update

      - name: 生成编译期配置（只输出键名）
        run: python3 scripts/write_bundle_defines.py /tmp/weihan_bundle_defines.json

      - name: Build 自带凭证 iOS Simulator 包
        run: |
          set -o pipefail
          if flutter build ios --simulator --debug --no-codesign \
              --dart-define-from-file=/tmp/weihan_bundle_defines.json \
              2>&1 | tee /tmp/bundled_ios.log; then
            exit 0
          fi
          python3 scripts/emit_build_error.py \
            /tmp/bundled_ios.log "自带凭证 iOS 构建"
          exit 1

      - name: 打包为未签名模拟器 IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphonesimulator/Runner.app dist/Payload/
          (cd dist && zip -qry weihan-selfuse-bundled-simulator.ipa Payload)
          ls -lh dist/*.ipa

      - name: Upload 自带凭证 iOS IPA
        if: ${{ needs.guard.outputs.artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weihan-selfuse-bundled-ipa-${{ github.run_number }}
          path: dist/weihan-selfuse-bundled-simulator.ipa
          if-no-files-found: error
          retention-days: 3

      - name: 清理 runner 临时凭证文件
        if: always()
        run: rm -f /tmp/weihan_bundle_defines.json

  summary:
    name: 出包说明
    needs: [guard, bundled-apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 写入运行摘要
        run: |
          echo "### 自带凭证自用包" >> "$GITHUB_STEP_SUMMARY"
          echo "凭证由 Secrets 在编译期注入，装包后无需在设置页填任何内容。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.guard.outputs.draft }}" = "true" ]; then
            echo "**仓库为 public → 本轮发的是草稿 Release**：登录你的 GitHub 账号后打开 [Releases 页面](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases) 即可看到并下载，匿名访客打不开。" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "直链（需登录）：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/selfuse-latest/weihan-selfuse-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**直接下载 APK（无需解压）**：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/selfuse-latest/weihan-selfuse-debug.apk" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ needs.guard.outputs.artifact }}" = "true" ]; then
              echo "也可从 [Releases 页面](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases) 下载；Artifacts 里的同名产物是 zip 备份，保留 3 天。" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**注意**：凭证在安装包二进制中可被反编译提取，请勿分发此包。" >> "$GITHUB_STEP_SUMMARY"

name: selfuse-bundled-build

# 「自带凭证的自用包」：CI 在编译期把 Secrets 注入安装包，装到手机后开箱即用，
# 设置页不用再填 APPID / APIKey / APISecret / vcn，语音按钮直接可用。
#
# 安全边界（务必先读 README「自带凭证自用包」一节）：
#   * 凭证不写源码、不写 Git 历史、不出现在命令行参数与构建日志；
#   * 但凭证会打进安装包二进制，反编译可提取，等同把密钥交给拿到包的人；
#   * private 仓库：Artifact + 公开 Release 都传，最方便；
#   * public 仓库：Artifact 与公开 Release 都能被匿名下载，所以只发「草稿 Release」
#     —— 只有拥有写权限的你登录后可见可下载，并把历史上已公开的包自动撤回为草稿。
#     若明确接受密钥外泄风险，把仓库 Variable BUNDLE_ALLOW_PUBLIC 设为 1 可强制公开上传。
#
# 与 verify-first-build.yml 的分工：
#   * verify-first-build：无凭证的干净门禁包，push 必跑，可安全分发；
#   * 本工作流：仅自用、含凭证的包，产物 retention 仅 3 天。

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "ios/**"
      - "scripts/**"
      - ".github/workflows/selfuse-bundled.yml"
  workflow_dispatch:

concurrency:
  group: selfuse-bundled-${{ github.ref }}
  cancel-in-progress: true

# 发布到 Releases 需要写权限；其余只读足够。
permissions:
  contents: write

jobs:
  guard:
    name: 凭证与可见性检查
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.decide.outputs.artifact }}
      draft: ${{ steps.decide.outputs.draft }}
      testflight: ${{ steps.tf.outputs.enabled }}
    env:
      # 仅做存在性判断，不打印任何值。
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
    steps:
      - name: 必需 Secret 齐全
        run: |
          missing=0
          for name in NIUTRANS_APP_ID NIUTRANS_API_KEY XFYUN_APP_ID XFYUN_API_KEY XFYUN_API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Secret ${name}，请到 Settings → Secrets and variables → Actions 补齐"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::凭证不齐，拒绝产出「看似免配置实则不可用」的安装包"
            exit 1
          fi
          echo "::notice::5 个必需 Secret 均已配置（未输出任何值）"

      - name: 决定发布方式（公开仓库只出草稿包）
        id: decide
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ALLOW_PUBLIC: ${{ vars.BUNDLE_ALLOW_PUBLIC }}
        run: |
          if [ "$REPO_PRIVATE" = "true" ] || [ "$ALLOW_PUBLIC" = "1" ]; then
            echo "artifact=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "::notice::允许公开上传自带凭证产物（private 仓库，或已显式放开 BUNDLE_ALLOW_PUBLIC）"
          else
            # public 仓库：Artifact 与公开 Release 都能被匿名下载，含凭证的包不能放上去。
            # 改成「草稿 Release」——只有拥有写权限的你登录后能看到与下载，匿名访客 404。
            echo "artifact=false" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库为 public：不上传 Artifact（可被第三方代理匿名下载），含凭证 APK 以草稿 Release 发布，只有你登录 GitHub 后能下载。"
          fi

      - name: 判断是否具备 TestFlight 凭证
        id: tf
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 四个都齐才走 TestFlight：缺一个就会在 macOS 上白烧十几分钟再失败，
          # 不如在这里判掉，退回「未签名 IPA」那条稳的路。
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
              && [ -n "$ASC_PRIVATE_KEY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight 凭证齐全：本轮 iOS 构建将自动上传到 TestFlight"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 TestFlight 凭证（ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY / APPLE_TEAM_ID），iOS 回退为未签名 IPA"
          fi

      - name: public 仓库时把历史公开包撤回为草稿
        if: ${{ steps.decide.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 历史上用过的所有含凭证附件名，任何一个都不能留在公开 Release 里。
          ASSET_NAMES: weihan-selfuse-debug.apk,weihan-selfuse-debug-fallback.apk,weihan-selfuse-arm64.apk,weihan-selfuse-v7a.apk,weihan-selfuse-ios-unsigned.ipa,weihan-selfuse-bundled-simulator.ipa
        run: |
          set -euo pipefail
          # 仓库从 private 转 public 时，之前发布的自带凭证包会突然变成人人可下载。
          # 这里尽量把它收回：优先转草稿，转不了就删 APK 附件，再不行删整条 Release。
          # 全部走 REST（gh api），因为 gh 子命令在不同 runner 版本上可用性不一致，
          # 而且失败时必须把 stderr 打出来——#7/#8 就是因为 2>/dev/null 才看不出原因。
          gh --version | head -1
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY'
          import json, os, subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          asset_names = {n.strip() for n in os.environ['ASSET_NAMES'].split(',') if n.strip()}

          def api(*args):
              return subprocess.run(['gh', 'api', *args], capture_output=True, text=True)

          releases = json.load(open('/tmp/releases.json', encoding='utf-8'))
          published = [r for r in releases if not r.get('draft')]
          print('::notice::已公开的 Release 共 %d 个，逐个尝试收回' % len(published))

          for rel in published:
              tag, rid = rel['tag_name'], rel['id']
              # 1) 转草稿（GitHub 对已发布的 Release 通常直接拒绝）
              p = api('-X', 'PATCH', 'repos/%s/releases/%s' % (repo, rid), '-F', 'draft=true')
              if p.returncode == 0:
                  print('::notice::已把 %s 撤回为草稿（公开页不再匿名可下载）' % tag)
                  continue
              print('::notice::%s 转草稿被拒：%s' % (tag, (p.stderr or '').strip()[:160]))

              # 2) 删掉它里面的 APK 附件
              assets = [a for a in rel.get('assets', []) if a['name'] in asset_names]
              removed = 0
              for asset in assets:
                  d = api('-X', 'DELETE', 'repos/%s/releases/assets/%s' % (repo, asset['id']))
                  if d.returncode == 0:
                      removed += 1
                  else:
                      print('::warning::删除 %s 的附件失败：%s' % (tag, (d.stderr or '').strip()[:160]))
              if removed:
                  print('::notice::%s 已删除 %d 个 APK 附件，公开页不再有可下载文件' % (tag, removed))
                  continue

              # 3) 最后手段：删掉整条 Release（git tag 保留，不影响代码）
              d = api('-X', 'DELETE', 'repos/%s/releases/%s' % (repo, rid))
              if d.returncode == 0:
                  print('::notice::已删除 Release %s（tag 保留）' % tag)
              else:
                  print('::warning::%s 彻底清理失败：%s' % (tag, (d.stderr or '').strip()[:160]))
          PY

  bundled-apk:
    name: Android 自带凭证 APK
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 只用于「要不要推 NAS」的判断；值本身不会被打印。
      NAS_HOST: ${{ secrets.NAS_HOST }}
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      NIUTRANS_UG_CODE: ${{ vars.NIUTRANS_UG_CODE }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      XFYUN_UG_VCN: ${{ secrets.XFYUN_UG_VCN }}
      XFYUN_ZH_VCN: ${{ vars.XFYUN_ZH_VCN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: 生成编译期配置（只输出键名）
        run: python3 scripts/write_bundle_defines.py /tmp/weihan_bundle_defines.json

      # 版本号是更新检查的比较基准，两处写岔会让 App 一直/永不提示更新。
      - name: 版本号一致性
        run: python3 scripts/check_version.py

      # 先证明 Dart 侧真的读到了注入值，并回归「设置页不回显 / 保存不清空」，
      # 再花几分钟做原生构建；避免构建完才发现注入链路有问题。
      - name: 注入自检 + 设置页回归
        run: |
          set -o pipefail
          if flutter test --timeout 90s --reporter expanded \
              --dart-define-from-file=/tmp/weihan_bundle_defines.json \
              test/bundled_config_test.dart 2>&1 | tee /tmp/bundled_config_test.log; then
            echo "::notice::内置凭证注入自检通过：配置已就绪、设置页不回显密钥、直接保存不清空"
          else
            echo "::error::内置凭证注入自检失败，输出如下："
            tail -n 60 /tmp/bundled_config_test.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # 体积：debug 包带 JIT 引擎 + 全套 ABI，实测 189MB；release 是 AOT 单 ABI，
      # 通常 15～22MB。这里按 ABI 分包，arm64 给绝大多数手机，armeabi-v7a 兜老机器。
      - name: Build 自带凭证 release APK（按 ABI 分包）
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::flutter build apk --release (attempt ${attempt}/3)"
            if flutter build apk --release --split-per-abi \
                --target-platform android-arm,android-arm64 \
                --dart-define-from-file=/tmp/weihan_bundle_defines.json \
                2>&1 | tee /tmp/bundled_apk.log; then
              echo "::endgroup::"
              ls -lh build/app/outputs/flutter-apk/*.apk
              exit 0
            fi
            echo "::endgroup::"
            python3 scripts/emit_build_error.py \
              /tmp/bundled_apk.log "自带凭证 release APK 构建" "${attempt}"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::构建失败，10s 后重试（第 ${attempt}/3 次）"
              sleep 10
            fi
          done
          echo "::error::自带凭证 release APK 连续 3 次构建失败"
          exit 1

      # 兜底：release 包万一在某台机器上起不来（AOT/插件问题），还能退回 debug。
      # 它体积大，只在说明里标成「异常时使用」，且失败不判本次运行失败。
      - name: Build 自带凭证 debug APK（兜底，体积大）
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define-from-file=/tmp/weihan_bundle_defines.json \
            2>&1 | tee /tmp/bundled_apk_debug.log || \
            python3 scripts/emit_build_error.py \
              /tmp/bundled_apk_debug.log "自带凭证 debug APK 构建" 1
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-apk-build-log-${{ github.run_number }}
          path: |
            /tmp/bundled_apk.log
            /tmp/bundled_apk_debug.log
          if-no-files-found: warn
          retention-days: 7

      # 只在 APK 里找「键名 / 提示文案」，不找也绝不打印凭证值。
      # 找不到只给 warning，不把门禁判红（Flutter 版本不同，snapshot 落点会变）。
      - name: 确认编译期配置确实进入安装包
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          apks = sorted(glob.glob('build/app/outputs/flutter-apk/*.apk'))
          if not apks:
              print('::error::没有找到构建产物 APK')
              raise SystemExit(1)
          # release 把 Dart 常量折叠掉，BUNDLED_SELFUSE 这个标识符名在 AOT 产物里
          # 已经不存在；设置页那条固定文案还在，但 Dart 侧非 ASCII 字符串按
          # UTF-16 存储，所以 UTF-8 与 UTF-16LE 两种编码都试一遍。
          notice = '凭证已内置于安装包'
          markers = [b'BUNDLED_SELFUSE', notice.encode('utf-8'),
                     notice.encode('utf-16-le')]
          for path in apks:
              hit = []
              with zipfile.ZipFile(path) as zf:
                  for name in zf.namelist():
                      if not name.endswith(('.so', '.bin', '.dat', '.json')):
                          continue
                      try:
                          data = zf.read(name)
                      except (RuntimeError, OSError):
                          continue
                      if any(m in data for m in markers):
                          hit.append(name)
              label = path.split('/')[-1]
              if hit:
                  print('::notice::%s 已确认打入编译期配置（命中 %s，只查键名与固定文案）'
                        % (label, ', '.join(hit)))
              else:
                  print('::warning::%s 内未搜索到编译期标记；release 的 AOT 快照可能把'
                        '常量与字符串都重编码了。以 Dart 侧注入自检为准。' % label)
          PY

      - name: 体积对比
        run: |
          python3 - <<'PY'
          import glob
          import os

          files = sorted(glob.glob('build/app/outputs/flutter-apk/*.apk'))
          rows = []
          for path in files:
              size = os.path.getsize(path)
              rows.append((os.path.basename(path), size))
              print('%-32s %6.1f MB' % (os.path.basename(path), size / 1048576))

          release = [r for r in rows if 'release' in r[0]]
          debug = [r for r in rows if 'debug' in r[0]]
          if release and debug:
              best = min(r[1] for r in release)
              dbg = debug[0][1]
              saved = 100 * (1 - best / dbg)
              print('::notice::最小包 %.1f MB，debug 包 %.1f MB，体积降到 %.0f%%（省 %.0f%%）'
                    % (best / 1048576, dbg / 1048576,
                       100.0 * best / dbg, saved))
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a',
                    encoding='utf-8') as out:
              out.write('\n### 安装包体积\n\n| 文件 | 大小 |\n| --- | --- |\n')
              for name, size in rows:
                  out.write('| %s | %.1f MB |\n' % (name, size / 1048576))
          PY

      - name: Upload 自带凭证 APK
        if: ${{ needs.guard.outputs.artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weihan-selfuse-bundled-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3

      # Actions 的 Artifacts 一定是 zip（平台强制），想直接下 .apk 只能走 Releases。
      # 每次构建发两个 Release：
      #   * 滚动 tag selfuse-latest —— 永远指向最新包，直链固定不变：
      #     https://github.com/<owner>/<repo>/releases/download/selfuse-latest/weihan-selfuse-arm64.apk
      #   * 版本 tag v<版本>-build<run>  —— 留历史，方便回退到某一版
      - name: 发布到 Releases（免解压直链 + 历史版本）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLING_TAG: selfuse-latest
          DRAFT: ${{ needs.guard.outputs.draft }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,sys; m=re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml',encoding='utf-8').read(), re.M); print(m.group(1) if m else '0.0.0')")"
          tag="v${version}-build${GITHUB_RUN_NUMBER}"
          commit="${GITHUB_SHA:0:7}"
          dir=build/app/outputs/flutter-apk

          # 产物换名字再发布：手机上下载时一眼能看出该装哪个。
          declare -a names=()
          add() {
            if [ -f "$1" ]; then
              cp "$1" "$2"
              names+=("$2")
            fi
          }
          add "$dir/app-arm64-v8a-release.apk" weihan-selfuse-arm64.apk
          add "$dir/app-armeabi-v7a-release.apk" weihan-selfuse-v7a.apk
          add "$dir/app-debug.apk" weihan-selfuse-debug-fallback.apk

          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::没有可发布的 APK"
            exit 1
          fi

          listing=""
          for f in "${names[@]}"; do
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            size="$(du -h "$f" | cut -f1)"
            listing="${listing}
          · ${f}（${size}）SHA-256 ${sha}"
          done
          echo "::notice::本轮产物：${names[*]}"

          # 草稿模式：只有仓库写权限者登录后可见可下载。
          if [ "${DRAFT}" = "true" ]; then
            visibility_note="（草稿包：仓库为 public，请登录你的 GitHub 账号后下载）"
          else
            visibility_note=""
          fi

          note="自带凭证的自用语音翻译包，装到手机即可使用，设置页无需填写任何内容。
          版本 ${version} · 构建 #${GITHUB_RUN_NUMBER} · commit ${commit}

          【怎么选】绝大多数手机（2015 年后、64 位）装 weihan-selfuse-arm64.apk，体积最小；
          很老的 32 位机器才装 weihan-selfuse-v7a.apk；
          weihan-selfuse-debug-fallback.apk 只在上面两个装不上或闪退时使用（体积大很多）。

          【iOS】weihan-selfuse-ios-unsigned.ipa 是未签名真机包（CI 没有你的证书），
          需用 Sideloadly / 爱思助手 / Xcode 重签后安装；首次打开到
          「设置 → 通用 → VPN 与设备管理」信任描述文件。该包在本轮构建稍后追加。

          产物与校验值：${listing}
          ${visibility_note}
          ⚠️ 凭证可被打包体反编译提取，请勿分发本包。"

          # 草稿 Release 在 releases/tags 接口上查不到，只能用列表判断是否已存在。
          has_release() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | python3 -c "import json,sys; print('\n'.join(r['tag_name'] for r in json.load(sys.stdin)))" \
              | grep -qx "$1"
          }

          if [ "${DRAFT}" = "true" ]; then
            # 已发布的 Release 无法用 PATCH draft=true 改回草稿（#7 实测被拒），
            # 所以草稿模式下先删掉同名 Release 再以草稿重建：
            # 任何时刻公开页面上都不会出现含凭证的包。tag 本身保留（不加 --cleanup-tag）。
            if has_release "$ROLLING_TAG"; then
              # 不吞 stderr：删不掉就让它显式失败，比默默留下一个公开包好。
              gh release delete "$ROLLING_TAG" --yes \
                || echo "::warning::删除旧的 ${ROLLING_TAG} 失败，下面创建可能报 already exists"
            fi
            gh release create "$ROLLING_TAG" --title "自用语音翻译包（最新）" \
              --notes "$note" --draft "${names[@]}"

            gh release create "$tag" --title "融合 ${version}（构建 ${GITHUB_RUN_NUMBER}）" \
              --notes "$note" --draft "${names[@]}"

            echo "::notice::已发为草稿 Release（${ROLLING_TAG} / ${tag}，共 ${#names[@]} 个包）。登录 GitHub 后在 Releases 页可见，推荐直链 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/weihan-selfuse-arm64.apk"
            exit 0
          fi

          # 公开模式（private 仓库或显式放开）：滚动 tag 覆盖同一批文件，直链永远最新
          if has_release "$ROLLING_TAG"; then
            gh release edit "$ROLLING_TAG" --title "自用语音翻译包（最新）" --notes "$note" --draft=false
          else
            gh release create "$ROLLING_TAG" --title "自用语音翻译包（最新）" --notes "$note"
          fi
          gh release upload "$ROLLING_TAG" "${names[@]}" --clobber

          # 版本 tag：留历史，出问题可回到某一版
          if has_release "$tag"; then
            echo "::notice::${tag} 已存在，跳过历史版本创建"
          else
            gh release create "$tag" --title "融合 ${version}（构建 ${GITHUB_RUN_NUMBER}）" \
              --notes "$note" "${names[@]}"
          fi

          echo "::notice::已发布：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/weihan-selfuse-arm64.apk"

      # 更新清单只描述「文件叫什么、多大、SHA-256」，不带域名：
      # App 用「更新源地址 + file」自己拼下载地址，换域名不用重出包。
      - name: 生成 Android 更新清单
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(python3 -c "import re; m=re.search(r'^version:\s*([0-9]+(?:\.[0-9]+)*)', open('pubspec.yaml',encoding='utf-8').read(), re.M); print(m.group(1) if m else '0.0.0')")"
          python3 scripts/make_update_manifest.py \
            --platform android \
            --file build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --name weihan-selfuse-arm64.apk \
            --notes "融合 ${VERSION} · 构建 #${GITHUB_RUN_NUMBER}" \
            --out dist/latest-android.json

      - name: 推送到 NAS（配了 NAS_HOST 才执行）
        if: env.NAS_HOST != ''
        env:
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_UPDATE_DIR: ${{ secrets.NAS_UPDATE_DIR }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/nas_key"
          umask 077
          printf '%s' "$NAS_SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          port="${NAS_PORT:-22}"
          dir="${NAS_UPDATE_DIR:-/volume1/docker/weihan-update/data}"
          scp -P "$port" -i "$key" -o StrictHostKeyChecking=accept-new \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/latest-android.json \
            "$NAS_USER@$NAS_HOST:$dir/"
          rm -f "$key"
          echo "::notice::APK 与 latest-android.json 已推送到 NAS"

      - name: 公开仓库说明（只出草稿包）
        if: ${{ needs.guard.outputs.artifact != 'true' }}
        run: |
          echo "::notice::仓库为 public：Artifact 不上传（公开仓库的 artifact 可被匿名代理下载），含凭证 APK 已以上面的草稿 Release 发布，登录 GitHub 账号后可下载。"

      - name: 清理 runner 临时凭证文件
        if: always()
        run: rm -f /tmp/weihan_bundle_defines.json

  bundled-ios:
    name: iOS 自带凭证包（真机未签名 IPA）
    # CI 里没有你的签名证书与描述文件，所以只能产出「未签名真机 IPA」：
    # 你用 Sideloadly / 爱思助手 / Xcode 自带证书重签后即可安装。
    # 等 APK 作业把 Release 建好再跑，避免两个作业抢同一个 Release。
    needs: [guard, bundled-apk]
    # 配了 TestFlight 凭证就走官方分发，不再产出需要重签的 IPA；
    # 没有凭证（或凭证不齐）时保留这条兜底路径。
    if: ${{ needs.guard.outputs.testflight != 'true' }}
    runs-on: macos-15
    timeout-minutes: 50
    env:
      # 只用于「要不要推 NAS」的判断；值本身不会被打印。
      NAS_HOST: ${{ secrets.NAS_HOST }}
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      NIUTRANS_UG_CODE: ${{ vars.NIUTRANS_UG_CODE }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      XFYUN_UG_VCN: ${{ secrets.XFYUN_UG_VCN }}
      XFYUN_ZH_VCN: ${{ vars.XFYUN_ZH_VCN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          test -f Podfile || { echo "::error::ios/Podfile 缺失"; exit 1; }
          pod install --no-repo-update

      - name: 生成编译期配置（只输出键名）
        run: python3 scripts/write_bundle_defines.py /tmp/weihan_bundle_defines.json

      # --no-codesign：跳过签名，产出未签名 Runner.app。真机装不上是正常的，
      # 需要你自己重签；这里只保证「编译通过 + 包结构完整 + 凭证已注入」。
      - name: Build 自带凭证 iOS release 包（真机、未签名）
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::flutter build ios --release --no-codesign (attempt ${attempt}/3)"
            if flutter build ios --release --no-codesign \
                --dart-define-from-file=/tmp/weihan_bundle_defines.json \
                2>&1 | tee /tmp/bundled_ios.log; then
              echo "::endgroup::"
              ls -ld build/ios/iphoneos/Runner.app
              exit 0
            fi
            echo "::endgroup::"
            python3 scripts/emit_build_error.py \
              /tmp/bundled_ios.log "自带凭证 iOS release 构建" "${attempt}"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::构建失败，10s 后重试（第 ${attempt}/3 次）"
              sleep 10
            fi
          done
          echo "::error::自带凭证 iOS release 包连续 3 次构建失败"
          exit 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-ios-build-log-${{ github.run_number }}
          path: /tmp/bundled_ios.log
          if-no-files-found: warn
          retention-days: 7

      # 标准 IPA 结构：Payload/Runner.app。zip 必须保留符号链接（-y），
      # 否则 .app 里的 Frameworks 软链会变成实体副本，重签工具会报错。
      - name: 打包为未签名 IPA
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          test -d "$app" || { echo "::error::没有找到 $app"; exit 1; }
          rm -rf dist
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          (cd dist && zip -qry -X weihan-selfuse-ios-unsigned.ipa Payload)
          ls -lh dist/weihan-selfuse-ios-unsigned.ipa

      - name: 校验 IPA 结构与编译期配置
        run: |
          python3 - <<'PY'
          import zipfile

          path = 'dist/weihan-selfuse-ios-unsigned.ipa'
          zf = zipfile.ZipFile(path)
          names = zf.namelist()
          print('::notice::IPA 条目 %d 个' % len(names))

          required = ['Payload/Runner.app/Info.plist', 'Payload/Runner.app/Runner']
          missing = [n for n in required if n not in names]
          if missing:
              print('::error::IPA 缺少必要文件：%s' % ', '.join(missing))
              raise SystemExit(1)

          # 未签名判定：签名后会生成 _CodeSignature 目录。
          signed = any(n.startswith('Payload/Runner.app/_CodeSignature') for n in names)
          if signed:
              print('::warning::IPA 内含 _CodeSignature，说明不是未签名包；重签前请确认')
          else:
              print('::notice::确认未签名（无 _CodeSignature），可用自己的证书重签')

          # release 的 Dart 代码在 App.framework/App 里；中文串按 UTF-16 存储，
          # 两种编码都试，只查固定文案，绝不打印任何凭证值。
          marker = '凭证已内置于安装包'
          probes = [marker.encode('utf-8'), marker.encode('utf-16-le')]
          target = 'Payload/Runner.app/Frameworks/App.framework/App'
          if target in names:
              data = zf.read(target)
              if any(p in data for p in probes):
                  print('::notice::已确认编译期配置进入 App.framework（仅命中固定文案）')
              else:
                  print('::warning::App.framework 内未搜到固定文案；AOT 可能重编码字符串，'
                        '以 Dart 侧注入自检为准')
          else:
              print('::warning::未找到 %s，跳过注入标记检查' % target)
          PY

      - name: Upload 自带凭证 iOS IPA
        if: ${{ needs.guard.outputs.artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: weihan-selfuse-bundled-ipa-${{ github.run_number }}
          path: dist/weihan-selfuse-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 3

      # 追加到 APK 作业刚建好的两个 Release（滚动 tag + 版本 tag）。
      # 草稿模式下同样可上传，匿名访客看不到。
      - name: 追加 IPA 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import re; m=re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml',encoding='utf-8').read(), re.M); print(m.group(1) if m else '0.0.0')")"
          tag="v${version}-build${GITHUB_RUN_NUMBER}"
          file=dist/weihan-selfuse-ios-unsigned.ipa
          sha="$(shasum -a 256 "$file" | cut -d' ' -f1)"
          size="$(du -h "$file" | cut -f1)"
          echo "::notice::iOS IPA ${size} · SHA-256 ${sha}"

          for t in selfuse-latest "$tag"; do
            for attempt in 1 2 3; do
              if gh release upload "$t" "$file" --clobber; then
                echo "::notice::已把 IPA 追加到 Release ${t}"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::向 Release ${t} 上传 IPA 连续 3 次失败"
                exit 1
              fi
              echo "::warning::上传到 ${t} 失败，10s 后重试（第 ${attempt}/3 次）"
              sleep 10
            done
          done

          {
            echo "### iOS 自带凭证包"
            echo ""
            echo "产物：\`weihan-selfuse-ios-unsigned.ipa\`（${size}）"
            echo ""
            echo "**未签名**：CI 没有你的证书。用 Sideloadly / 爱思助手 / Xcode 重签后安装，首次打开需在「设置 → 通用 → VPN 与设备管理」信任描述文件。"
            echo ""
            echo "SHA-256：\`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成 iOS 更新清单
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import re; m=re.search(r'^version:\s*([0-9]+(?:\.[0-9]+)*)', open('pubspec.yaml',encoding='utf-8').read(), re.M); print(m.group(1) if m else '0.0.0')")"
          python3 scripts/make_update_manifest.py \
            --platform ios \
            --file dist/weihan-selfuse-ios-unsigned.ipa \
            --name weihan-selfuse-ios-unsigned.ipa \
            --notes "融合 ${VERSION} · 构建 #${GITHUB_RUN_NUMBER}（未签名，需重签后安装）" \
            --out dist/latest-ios.json

      - name: 推送到 NAS（配了 NAS_HOST 才执行）
        if: env.NAS_HOST != ''
        env:
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_UPDATE_DIR: ${{ secrets.NAS_UPDATE_DIR }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/nas_key"
          umask 077
          printf '%s' "$NAS_SSH_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          port="${NAS_PORT:-22}"
          dir="${NAS_UPDATE_DIR:-/volume1/docker/weihan-update/data}"
          scp -P "$port" -i "$key" -o StrictHostKeyChecking=accept-new \
            dist/weihan-selfuse-ios-unsigned.ipa \
            dist/latest-ios.json \
            "$NAS_USER@$NAS_HOST:$dir/"
          rm -f "$key"
          echo "::notice::IPA 与 latest-ios.json 已推送到 NAS"

      - name: 清理 runner 临时凭证文件
        if: always()
        run: rm -f /tmp/weihan_bundle_defines.json

  testflight:
    name: iOS TestFlight 自动上传
    # 有付费开发者账号时的主路：构建直接进 TestFlight，手机上点「更新」即可，
    # 不用重签、不用连电脑。签名走 App Store Connect API Key + 自动管理描述文件，
    # 证书与 .p8 都只存在于 Secrets 和 runner 临时目录。
    needs: [guard, bundled-apk]
    if: ${{ needs.guard.outputs.testflight == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      NIUTRANS_UG_CODE: ${{ vars.NIUTRANS_UG_CODE }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      XFYUN_UG_VCN: ${{ secrets.XFYUN_UG_VCN }}
      XFYUN_ZH_VCN: ${{ vars.XFYUN_ZH_VCN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native shells
        run: bash scripts/bootstrap.sh

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          test -f Podfile || { echo "::error::ios/Podfile 缺失"; exit 1; }
          pod install --no-repo-update

      # xcodebuild 默认从这个位置读 .p8；写到 umask 077 的目录，用完删掉。
      # 只校验首行标记，绝不打印内容。
      - name: 写入 App Store Connect API Key（不回显）
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" | tr -d '\r' \
            > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_dir/AuthKey_${ASC_KEY_ID}.p8"; then
            echo "::error::ASC_PRIVATE_KEY 不是完整的 .p8 内容（缺少 BEGIN PRIVATE KEY 行）"
            exit 1
          fi
          echo "::notice::API Key 已写入 runner 临时目录，内容未输出"

      - name: 生成编译期配置（只输出键名）
        run: python3 scripts/write_bundle_defines.py /tmp/weihan_bundle_defines.json

      # 只生成 xcconfig 与 Flutter 资产，不编译：编译交给下面的 xcodebuild，
      # 这样签名参数（API Key、自动管理描述文件）才能完整传进去。
      # build number 用 run_number，保证每次上传 TestFlight 都是新构建。
      - name: 生成 Xcode 配置
        run: |
          flutter build ios --release --config-only \
            --build-number="${{ github.run_number }}" \
            --dart-define-from-file=/tmp/weihan_bundle_defines.json

      - name: Build iOS archive（自动签名）
        run: |
          set -o pipefail
          AUTH=(
            "-allowProvisioningUpdates"
            "-authenticationKeyPath" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            "-authenticationKeyID" "$ASC_KEY_ID"
            "-authenticationKeyIssuerID" "$ASC_ISSUER_ID"
          )
          if xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Release \
              -archivePath build/ios/Runner.xcarchive \
              -destination 'generic/platform=iOS' \
              "${AUTH[@]}" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              archive 2>&1 | tee /tmp/ios_archive.log; then
            echo "::notice::archive 成功"
          else
            python3 scripts/emit_build_error.py \
              /tmp/ios_archive.log "iOS archive（自动签名）"
            exit 1
          fi

      - name: 导出 App Store IPA
        run: |
          set -o pipefail
          rm -rf build/ios/ipa
          AUTH=(
            "-allowProvisioningUpdates"
            "-authenticationKeyPath" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            "-authenticationKeyID" "$ASC_KEY_ID"
            "-authenticationKeyIssuerID" "$ASC_ISSUER_ID"
          )
          if xcodebuild -exportArchive \
              -archivePath build/ios/Runner.xcarchive \
              -exportPath build/ios/ipa \
              -exportOptionsPlist ios/ExportOptions-AppStore.plist \
              "${AUTH[@]}" 2>&1 | tee /tmp/ios_export.log; then
            ls -lh build/ios/ipa
          else
            python3 scripts/emit_build_error.py \
              /tmp/ios_export.log "iOS 导出 App Store IPA"
            exit 1
          fi

      - name: 上传到 TestFlight
        run: |
          set -o pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::导出目录里没有 .ipa"
            exit 1
          fi
          if ! xcrun --find altool >/dev/null 2>&1; then
            echo "::error::当前 Xcode 没有 altool，无法上传；请改用 fastlane pilot"
            exit 1
          fi
          if xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
              --output-format json 2>&1 | tee /tmp/testflight_upload.json; then
            VERSION="$(python3 -c "import re,sys; m=re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml',encoding='utf-8').read(), re.M); print(m.group(1) if m else '0.0.0')")"
            echo "::notice::已上传 TestFlight：${VERSION} (build ${{ github.run_number }})。处理完成后在手机上打开 TestFlight 点更新即可。"
          else
            echo "::error::TestFlight 上传失败，真实错误见下方"
            tail -n 40 /tmp/testflight_upload.json | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-log-${{ github.run_number }}
          path: |
            /tmp/ios_archive.log
            /tmp/ios_export.log
            /tmp/testflight_upload.json
          if-no-files-found: warn
          retention-days: 7

      - name: 清理 runner 临时凭证文件
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f /tmp/weihan_bundle_defines.json

  summary:
    name: 出包说明
    needs: [guard, bundled-apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 写入运行摘要
        run: |
          echo "### 自带凭证自用包" >> "$GITHUB_STEP_SUMMARY"
          echo "凭证由 Secrets 在编译期注入，装包后无需在设置页填任何内容。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.guard.outputs.draft }}" = "true" ]; then
            echo "**仓库为 public → 本轮发的是草稿 Release**：登录你的 GitHub 账号后打开 [Releases 页面](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases) 即可看到并下载，匿名访客打不开。" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "推荐直链（需登录）：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/selfuse-latest/weihan-selfuse-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**直接下载 APK（无需解压）**：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/selfuse-latest/weihan-selfuse-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ needs.guard.outputs.artifact }}" = "true" ]; then
              echo "也可从 [Releases 页面](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases) 下载；Artifacts 里的同名产物是 zip 备份，保留 3 天。" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**怎么选**：64 位手机装 \`weihan-selfuse-arm64.apk\`；老 32 位机器装 \`weihan-selfuse-v7a.apk\`；两个都装不上才用 \`weihan-selfuse-debug-fallback.apk\`（体积大）。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**iOS**：\`weihan-selfuse-ios-unsigned.ipa\`（真机未签名，需自签后安装）由稍后运行的 iOS 作业追加到同一个 Release。直接下载需登录（草稿模式）。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**注意**：凭证在安装包二进制中可被反编译提取，请勿分发此包。" >> "$GITHUB_STEP_SUMMARY"

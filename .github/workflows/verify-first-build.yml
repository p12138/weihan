name: verify-first-build

# 首次编译质量门禁：零密钥、不上架、只回答一个问题——
# 「这份从没真编译过的 Flutter 工程，能不能跑通 analyze / test / debug APK？」
#
# 与 selfuse-android.yml 的分工：
#   - 本工作流：push / PR 自动跑，纯验证，不需要任何 Secrets
#   - selfuse-android.yml：手动触发，负责产出发给朋友的 APK（可签名）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-first-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Static self-check (structure / deps / secrets)
        run: python3 scripts/verify_project.py --scope all

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test --reporter expanded

      - name: Generate android/ ios/ shells and permissions
        run: bash scripts/bootstrap.sh

      - name: Build debug APK (no signing, no secrets)
        run: |
          # Gradle 发行包需从公网下载，实测偶发中断（4 次 CI 中有 2 次仅此步失败，
          # 且工程代码完全相同的 run #1 / #3 均全绿）。失败后最多重试 2 次。
          for attempt in 1 2 3; do
            echo "::group::flutter build apk (attempt ${attempt}/3)"
            if flutter build apk --debug; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle 发行包下载疑似中断，10s 后重试"
              sleep 10
            fi
          done
          echo "::error::flutter build apk 连续 3 次失败"
          exit 1

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -type f -exec cp {} dist/ \; 2>/dev/null || true
          cp pubspec.lock dist/ 2>/dev/null || true
          # bootstrap.sh 生成的原生壳单独打包：取回提交后各机器不再各自生成，避免配置漂移。
          # 排除 Gradle / Xcode 构建产物、本机 SDK 路径与签名资产（后者本就不该进仓库）。
          tar -czf dist/native-shells.tar.gz \
            --exclude='android/.gradle' \
            --exclude='android/build' \
            --exclude='android/app/build' \
            --exclude='android/local.properties' \
            --exclude='android/key.properties' \
            --exclude='*.jks' --exclude='*.keystore' \
            --exclude='ios/Pods' \
            --exclude='ios/.symlinks' \
            --exclude='ios/Flutter/Generated.xcconfig' \
            --exclude='ios/Flutter/flutter_export_environment.sh' \
            android ios 2>/dev/null || true
          # 原生壳产物必须含 ios/Podfile，否则回填后 pod install 会失败
          tar -tzf dist/native-shells.tar.gz 2>/dev/null | grep -q '^ios/Podfile$' \
            || echo "::warning::原生壳产物缺少 ios/Podfile，取回后需补跑 bootstrap.sh"
          ls -lh dist || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: verify-debug-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload locked dependencies
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock-${{ github.run_number }}
          path: dist/pubspec.lock
          retention-days: 14
          if-no-files-found: warn

      - name: Upload native shells (android/ + ios/)
        uses: actions/upload-artifact@v4
        with:
          name: native-shells-${{ github.run_number }}
          path: dist/native-shells.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### 首次编译门禁" >> "$GITHUB_STEP_SUMMARY"
          echo "通过即代表：静态自检 / analyze / test / 原生壳 / debug APK 全部可用。" >> "$GITHUB_STEP_SUMMARY"
          echo "本工作流不签名、不出 release 包、不上传任何商店。" >> "$GITHUB_STEP_SUMMARY"

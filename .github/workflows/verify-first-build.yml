name: verify-first-build

# 首次编译质量门禁：零密钥、不上架、只回答一个问题——
# 「这份从没真编译过的 Flutter 工程，能不能跑通 analyze / test / debug APK？」
#
# 与 selfuse-android.yml 的分工：
#   - 本工作流：push / PR 自动跑，纯验证，不需要任何 Secrets
#   - selfuse-android.yml：手动触发，负责产出发给朋友的 APK（可签名）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-first-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 可选：配置后 CI 会真实调用一次对应服务，验证凭证 / 语种码 / 签名。
      # 未配置时对应步骤自动跳过，门禁照常全绿；密钥不进代码、不进产物。
      # 默认后端是无需绑卡的小牛翻译；Azure 保留为可选后端。
      NIUTRANS_APP_ID: ${{ secrets.NIUTRANS_APP_ID }}
      NIUTRANS_API_KEY: ${{ secrets.NIUTRANS_API_KEY }}
      NIUTRANS_UG_CODE: ${{ vars.NIUTRANS_UG_CODE }}
      XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      XFYUN_UG_VCN: ${{ secrets.XFYUN_UG_VCN }}
      XFYUN_ZH_VCN: ${{ vars.XFYUN_ZH_VCN }}
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Static self-check (structure / deps / secrets)
        run: python3 scripts/verify_project.py --scope all

      # 图标由脚本从 brand/ 母版生成；同时守住「冷启动不再出现缩小版启动页」：
      # 旧位图文件、原生层对它的引用、Android 12+ 的系统小图标都要在这里判红。
      - name: Brand assets check (icons / splash)
        run: python3 scripts/generate_brand_assets.py --check

      - name: Install dependencies
        run: flutter pub get

      # 无论后续原生构建成功与否都要能取回解析后的 lock，
      # 回填到仓库后各机器与 CI 使用完全相同的插件版本。
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock-resolved-${{ github.run_number }}
          path: pubspec.lock
          if-no-files-found: warn
          retention-days: 7

      - name: Static analysis
        run: |
          set -o pipefail
          if flutter analyze 2>&1 | tee /tmp/flutter_analyze.log; then
            exit 0
          fi
          # 匿名访问看不到 job logs（需仓库 admin），把完整输出写进批注便于排错
          echo "::error::flutter analyze 失败，完整输出如下（逐行写入批注）："
          while IFS= read -r line || [ -n "$line" ]; do
            echo "::error::${line}"
          done < /tmp/flutter_analyze.log
          exit 1

      - name: Unit tests
        run: |
          set -o pipefail
          # live_* 会打真实云端：偶发慢响应会撞上 flutter test 默认 30s 超时，
          # 白白把门禁判红，还重复消耗免费额度。它们只由下面各自的 live check
          # 步骤单独跑（各自放宽超时）；这里只跑确定性单测 + widget 回归。
          mapfile -t unit_tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'live_*' -print | sort)
          echo "本轮确定性单测：${unit_tests[*]}"
          if flutter test --reporter expanded "${unit_tests[@]}" 2>&1 | tee /tmp/flutter_test.log; then
            exit 0
          fi
          # 匿名访问看不到 job logs，把测试输出写进批注便于排错
          echo "::error::flutter test 失败，完整输出如下（末尾 80 行）："
          tail -n 80 /tmp/flutter_test.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: NiuTrans live check (optional)
        if: ${{ env.NIUTRANS_APP_ID != '' && env.NIUTRANS_API_KEY != '' }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.request

          app_id = os.environ['NIUTRANS_APP_ID']
          api_key = os.environ['NIUTRANS_API_KEY']
          url = 'https://api.niutrans.com/v2/text/translate'
          # run #22 实测可用组合为 to=uy + 毫秒时间戳，故默认优先 uy。
          preferred = (os.environ.get('NIUTRANS_UG_CODE') or 'uy').strip()
          # 官方文档的语种码（ug / uy）与时间戳单位（毫秒 / 秒）存在分歧，
          # 这里逐组合实测，把可用组合写进批注，便于零凭证排错。
          codes = list(dict.fromkeys([preferred, 'uy', 'ug']))
          attempts = []
          for code in codes:
              for millis in (True, False):
                  now = int(time.time() * 1000) if millis else int(time.time())
                  params = {
                      'from': 'zh',
                      'to': code,
                      'appId': app_id,
                      'srcText': '你好',
                      'timestamp': str(now),
                      'apikey': api_key,
                  }
                  param_str = '&'.join(
                      '%s=%s' % (k, params[k]) for k in sorted(params))
                  body = {k: v for k, v in params.items() if k != 'apikey'}
                  body['authStr'] = hashlib.md5(
                      param_str.encode('utf-8')).hexdigest()
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(body, ensure_ascii=False).encode('utf-8'),
                      headers={'Content-Type': 'application/json'},
                      method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=25) as resp:
                          data = json.loads(resp.read().decode('utf-8'))
                  except Exception as exc:
                      attempts.append('%s/%s -> 请求异常 %s' % (
                          code, '毫秒' if millis else '秒', exc))
                      continue
                  text = ((data.get('tgtText') or '').strip()
                          if isinstance(data, dict) else '')
                  if text:
                      msg = ('NiuTrans 实测成功：to=%s timestamp=%s 译文=%s'
                             % (code, '毫秒' if millis else '秒', text))
                      print(msg)
                      print('::notice::' + msg)
                      sys.exit(0)
                  attempts.append('%s/%s -> %s' % (
                      code, '毫秒' if millis else '秒', data))
          for line in attempts:
              print('::error::' + line)
          sys.exit(1)
          PY

      # 上面的 Python 脚本只验证凭证与服务端；这里直接跑 App 里的 Dart 实现，
      # 覆盖 URI / 签名 / 请求体 / 响应解析整条用户侧路径。
      - name: Dart live check (optional)
        if: ${{ env.NIUTRANS_APP_ID != '' && env.NIUTRANS_API_KEY != '' }}
        run: |
          set -o pipefail
          if flutter test --timeout 90s --reporter expanded test/live_niutrans_test.dart 2>&1 | tee /tmp/dart_live.log; then
            grep 'Dart live check:' /tmp/dart_live.log | while IFS= read -r line; do
              echo "::notice::${line}"
            done
          else
            echo "::error::Dart 云端实测失败，完整输出如下："
            tail -n 60 /tmp/dart_live.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # 语音链路同样直接跑 App 里的 Dart 实现：TTS 生成 16k PCM → ASR 识别闭环。
      - name: Xfyun speech live check (optional)
        if: ${{ env.XFYUN_APP_ID != '' && env.XFYUN_API_KEY != '' && env.XFYUN_API_SECRET != '' }}
        run: |
          set -o pipefail
          # 讯飞偶发单段卡住（#46 一次超时把整轮打红，而单测与翻译链路都正常）。
          # 给两次机会：第一次失败等 15s 再跑，避免把上游抖动当成代码回归。
          for attempt in 1 2; do
            echo "::notice::讯飞 live check 第 ${attempt}/2 次尝试"
            if flutter test --timeout 300s --reporter expanded test/live_xfyun_test.dart 2>&1 | tee /tmp/xfyun_live.log; then
              grep 'Xfyun live check:' /tmp/xfyun_live.log | while IFS= read -r line; do
                # 维语发音人是账号侧授权：失败不判红（不是代码回归），但必须
                # 在批注里显式告警，否则「CI 全绿 + 手机没声音」会看起来很矛盾。
                case "$line" in
                  *'维语音色暂不可用'*|*'未配置 XFYUN_UG_VCN'*)
                    echo "::warning::${line}" ;;
                  *) echo "::notice::${line}" ;;
                esac
              done
              exit 0
            fi
            if [ "$attempt" = "1" ]; then sleep 15; fi
          done
          echo "::error::讯飞语音实测失败（已重试 1 次），完整输出如下："
          tail -n 60 /tmp/xfyun_live.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      # 端到端：真实凭证跑完整三环（TTS 造 PCM 当录音 → ASR → 小牛 MT → TTS），
      # 结果再回灌给 widget 测试，断言录音按钮 / 两条气泡 / 自动朗读 / 朗读按钮。
      # 不设 E2E_LIVE 时同一文件只跑确定性 UI 回归，不消耗云端额度。
      - name: Speech E2E live check (optional)
        if: ${{ env.XFYUN_APP_ID != '' && env.XFYUN_API_KEY != '' && env.XFYUN_API_SECRET != '' && env.NIUTRANS_APP_ID != '' && env.NIUTRANS_API_KEY != '' }}
        env:
          E2E_LIVE: '1'
        run: |
          set -o pipefail
          rm -f /tmp/weihan_e2e.json
          # 第一层：纯 test() 文件跑真实三环，把真实识别文本 / 译文写进结果文件。
          # 绝不能和 testWidgets 放同一文件 —— fake async 会让 WebSocket 卡到超时。
          # 给三次机会抗上游抖动；单个用例卡住最多 120s 就会被掐断，
          # 不再让一次握不上手就拖满 5 分钟。
          network_ok=0
          for attempt in 1 2 3; do
            echo "::notice::三环 live check 第 ${attempt}/3 次尝试"
            if flutter test --timeout 120s --reporter expanded \
                test/live_speech_pipeline_test.dart 2>&1 | tee /tmp/e2e_network.log; then
              network_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$network_ok" = "1" ]; then
            grep 'E2E live check:' /tmp/e2e_network.log | while IFS= read -r line; do
              echo "::notice::${line}"
            done
          else
            echo "::error::语音三环真实链路失败（已重试 2 次），完整输出如下："
            tail -n 80 /tmp/e2e_network.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          # 第二层：widget 测试读真实结果回放 UI（无结果文件时自动用脚本数据）。
          if flutter test --timeout 90s --reporter expanded \
              test/speech_e2e_test.dart 2>&1 | tee /tmp/e2e_ui.log; then
            echo "::notice::E2E UI 回归通过：录音启停 / 双气泡 / 自动朗读 / 朗读按钮"
          else
            echo "::error::语音 UI 端到端回归失败，完整输出如下："
            tail -n 80 /tmp/e2e_ui.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Azure Translator live check (optional)
        if: ${{ env.AZURE_TRANSLATOR_KEY != '' }}
        run: |
          args=(
            -sS --max-time 30 -X POST
            "https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&from=zh-Hans&to=ug"
            -H "Ocp-Apim-Subscription-Key: ${AZURE_TRANSLATOR_KEY}"
            -H "Content-Type: application/json; charset=UTF-8"
            -d '[{"Text":"你好"}]'
          )
          if [ -n "${AZURE_TRANSLATOR_REGION}" ]; then
            args+=(-H "Ocp-Apim-Subscription-Region: ${AZURE_TRANSLATOR_REGION}")
          fi
          curl "${args[@]}" -o /tmp/azure_live.json
          python3 - <<'PY'
          import json, sys
          with open('/tmp/azure_live.json', encoding='utf-8') as f:
              data = json.load(f)
          try:
              text = data[0]['translations'][0]['text']
          except (KeyError, IndexError, TypeError):
              print('Azure 返回异常：', data)
              sys.exit(1)
          if not text.strip():
              print('Azure 返回空译文')
              sys.exit(1)
          print('Azure zh-Hans -> ug 实测译文：', text)
          PY

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log-${{ github.run_number }}
          path: /tmp/flutter_test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate android/ ios/ shells and permissions
        run: bash scripts/bootstrap.sh

      - name: Build debug APK (no signing, no secrets)
        run: |
          # Gradle 发行包需从公网下载，实测偶发中断（4 次 CI 中有 2 次仅此步失败，
          # 且工程代码完全相同的 run #1 / #3 均全绿）。失败后最多重试 2 次。
          # 匿名访问看不到 job logs（需仓库 admin），失败时把真实日志写进批注。
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::flutter build apk (attempt ${attempt}/3)"
            if flutter build apk --debug 2>&1 | tee /tmp/flutter_build_apk.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            python3 scripts/emit_build_error.py \
              /tmp/flutter_build_apk.log "flutter build apk" "${attempt}"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::构建失败，10s 后重试（第 ${attempt}/3 次）"
              sleep 10
            fi
          done
          echo "::error::flutter build apk 连续 3 次失败"
          exit 1

      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.run_number }}
          path: /tmp/flutter_build_apk.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -type f -exec cp {} dist/ \; 2>/dev/null || true
          cp pubspec.lock dist/ 2>/dev/null || true
          # bootstrap.sh 生成的原生壳单独打包：取回提交后各机器不再各自生成，避免配置漂移。
          # 排除 Gradle / Xcode 构建产物、本机 SDK 路径与签名资产（后者本就不该进仓库）。
          tar -czf dist/native-shells.tar.gz \
            --exclude='android/.gradle' \
            --exclude='android/build' \
            --exclude='android/app/build' \
            --exclude='android/local.properties' \
            --exclude='android/key.properties' \
            --exclude='*.jks' --exclude='*.keystore' \
            --exclude='ios/Pods' \
            --exclude='ios/.symlinks' \
            --exclude='ios/Flutter/Generated.xcconfig' \
            --exclude='ios/Flutter/flutter_export_environment.sh' \
            android ios 2>/dev/null || true
          # 原生壳产物必须含 ios/Podfile，否则回填后 pod install 会失败
          tar -tzf dist/native-shells.tar.gz 2>/dev/null | grep -q '^ios/Podfile$' \
            || echo "::warning::原生壳产物缺少 ios/Podfile，取回后需补跑 bootstrap.sh"
          ls -lh dist || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: verify-debug-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload locked dependencies
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock-${{ github.run_number }}
          path: dist/pubspec.lock
          retention-days: 14
          if-no-files-found: warn

      - name: Upload native shells (android/ + ios/)
        uses: actions/upload-artifact@v4
        with:
          name: native-shells-${{ github.run_number }}
          path: dist/native-shells.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### 首次编译门禁" >> "$GITHUB_STEP_SUMMARY"
          echo "通过即代表：静态自检 / analyze / test / 原生壳 / debug APK 全部可用。" >> "$GITHUB_STEP_SUMMARY"
          echo "本工作流不签名、不出 release 包、不上传任何商店。" >> "$GITHUB_STEP_SUMMARY"

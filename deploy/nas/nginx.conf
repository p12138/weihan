server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # 给容器健康检查用，不暴露目录列表。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 清单必须每次都是最新的：App 靠它判断有没有新版，被缓存住就会
    # 「明明发了新版却查不到」。no-store 同时约束浏览器与中间代理。
    location ~ ^/latest-(android|ios)\.json$ {
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 安装包体积大，允许缓存但每次回源校验；下载中断后重试也能命中。
    location ~ \.(apk|ipa)$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    # 其余路径一律 404：这个服务只用来分发，不做目录浏览。
    location / {
        try_files $uri =404;
    }
}

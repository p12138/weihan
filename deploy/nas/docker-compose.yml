# 融合 App 的更新分发服务（NAS 侧）
#
# 只做一件事：把一个目录以只读 HTTP 暴露出去，Lucky 在前面做 HTTPS 反代。
# 目录里放：
#   latest-android.json   安卓更新清单
#   latest-ios.json       iOS 更新清单（走 TestFlight 时可不放）
#   weihan-selfuse-arm64.apk
#   weihan-selfuse-ios-unsigned.ipa
#
# 启动：docker compose up -d
# 端口只监听内网即可，公网入口交给 Lucky。

services:
  weihan-update:
    image: nginx:1.27-alpine
    container_name: weihan-update
    restart: unless-stopped
    ports:
      # NAS 内网端口。Lucky 反代到 http://<NAS_IP>:8088
      - "8088:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
